apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-app
  namespace: oficina
  labels:
    app: oficina-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: oficina-app
  template:
    metadata:
      labels:
        app: oficina-app
    spec:
      # A imagem em ghcr.io é privada (herda a visibilidade do repositório) —
      # sem isso o pull falha com ImagePullBackOff. Secret criado pela
      # pipeline de CI/CD a partir do GITHUB_TOKEN, ver ci-cd.yml.
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: oficina-app
          # Substituído em tempo de deploy pela pipeline de CI/CD
          # (ver .github/workflows/ci-cd.yml) com a tag da imagem publicada.
          image: ghcr.io/OWNER/oficina-tech-challenge:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: oficina-app-config
            - secretRef:
                name: oficina-app-secret
          resources:
            requests:
              cpu: '100m'
              memory: '128Mi'
            limits:
              cpu: '500m'
              memory: '256Mi'
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
