# Datadog Agent (DaemonSet): coleta métricas de CPU/memória dos nós e pods,
# healthchecks, e recebe os traces do APM (dd-trace, ver src/tracer.ts) via
# DD_AGENT_HOST (injetado no Deployment do app a partir do IP do nó).
#
# Pré-requisito: kubectl create secret generic datadog-secret -n oficina \
#   --from-literal api-key=<SUA_CHAVE_DATADOG>
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: datadog-agent
  namespace: oficina
spec:
  selector:
    matchLabels:
      app: datadog-agent
  template:
    metadata:
      labels:
        app: datadog-agent
        name: datadog-agent
    spec:
      serviceAccountName: default
      containers:
        - name: datadog-agent
          image: gcr.io/datadoghq/agent:7
          env:
            - name: DD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: datadog-secret
                  key: api-key
            - name: DD_SITE
              value: 'datadoghq.com'
            - name: DD_KUBERNETES_KUBELET_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: DD_APM_ENABLED
              value: 'true'
            - name: DD_APM_NON_LOCAL_TRAFFIC
              value: 'true'
            - name: DD_LOGS_ENABLED
              value: 'true'
            - name: DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL
              value: 'true'
          resources:
            requests:
              cpu: '100m'
              memory: '256Mi'
            limits:
              cpu: '200m'
              memory: '512Mi'
          volumeMounts:
            - name: dockersocket
              mountPath: /var/run/docker.sock
            - name: procdir
              mountPath: /host/proc
              readOnly: true
            - name: cgroups
              mountPath: /host/sys/fs/cgroup
              readOnly: true
      volumes:
        - name: dockersocket
          hostPath:
            path: /var/run/docker.sock
        - name: procdir
          hostPath:
            path: /proc
        - name: cgroups
          hostPath:
            path: /sys/fs/cgroup
