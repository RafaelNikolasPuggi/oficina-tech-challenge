apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-app
  namespace: oficina
  labels:
    app: oficina-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: oficina-app
  template:
    metadata:
      labels:
        app: oficina-app
    spec:
      # A imagem em ghcr.io é privada (herda a visibilidade do repositório) —
      # sem isso o pull falha com ImagePullBackOff. Secret criado pela
      # pipeline de CI/CD a partir do GITHUB_TOKEN, ver ci-cd.yml.
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: oficina-app
          # Substituído em tempo de deploy pela pipeline de CI/CD com a tag
          # da imagem recém publicada em ghcr.io.
          image: ghcr.io/OWNER/oficina-tech-challenge:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: oficina-app-config
            - secretRef:
                name: oficina-app-secret
          env:
            # newrelic-secret só existe quando NEW_RELIC_LICENSE_KEY está
            # configurado no repositório — ver ci-cd.yml. O agente do New
            # Relic fica desligado (NEW_RELIC_ENABLED do ConfigMap não é
            # suficiente sozinho) sem uma license key válida.
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: newrelic-secret
                  key: license-key
                  optional: true
          resources:
            requests:
              cpu: '100m'
              memory: '128Mi'
            limits:
              cpu: '500m'
              memory: '256Mi'
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
