name: Diagnóstico manual (por que o New Relic não recebe dados)

on:
  workflow_dispatch:

jobs:
  diag:
    name: Inspecionar pods reais em busca de erros do agente New Relic
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: azure/setup-kubectl@v4

      - name: Apontar kubectl para o cluster EKS
        run: |
          EKS_CLUSTER_NAME=$(aws ssm get-parameter --name /oficina/eks_cluster_name --query Parameter.Value --output text)
          aws eks update-kubeconfig --region "${{ vars.AWS_REGION || 'us-east-1' }}" --name "$EKS_CLUSTER_NAME"

      - name: Reiniciar os pods (pega o secret atualizado) e esperar ficarem prontos
        run: |
          kubectl -n oficina rollout restart deployment/oficina-app
          kubectl -n oficina rollout status deployment/oficina-app --timeout=180s
          echo "Aguardando o agente ter tempo de conectar..."
          sleep 25

      - name: Pods e variáveis de ambiente relevantes
        run: |
          echo "::group::Pods no namespace oficina"
          kubectl -n oficina get pods -o wide
          echo "::endgroup::"

          POD=$(kubectl -n oficina get pods -l app=oficina-app --field-selector=status.phase=Running -o jsonpath='{.items[0].metadata.name}')
          echo "Pod selecionado: $POD"

          echo "::group::Variáveis NEW_RELIC_* dentro do container"
          kubectl -n oficina exec "$POD" -- env | grep -i "NEW_RELIC" || echo "(nenhuma variável NEW_RELIC_* encontrada no container)"
          echo "::endgroup::"

          echo "::group::Logs do pod (grep newrelic, case-insensitive, ultimas 300 linhas)"
          kubectl -n oficina logs "$POD" --tail=300 | grep -i "newrelic" || echo "(nenhuma linha mencionando newrelic nos logs)"
          echo "::endgroup::"

          echo "::group::Logs do pod (primeiras 60 linhas, para ver o boot completo)"
          kubectl -n oficina logs "$POD" --tail=1000 | head -60
          echo "::endgroup::"

      - name: Secret newrelic-secret existe?
        run: |
          kubectl -n oficina get secret newrelic-secret -o jsonpath='{.data.license-key}' | base64 -d | wc -c
          echo " <- tamanho da license key decodificada (deve ser > 0)"
