name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test -- --coverage

      - name: Publicar relatório de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  docker-build-push:
    name: Build & Push da imagem Docker
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        # Nomes de imagem Docker precisam ser lowercase — github.repository
        # preserva a caixa do usuário/organização (ex.: RafaelNikolasPuggi),
        # por isso não dá pra usar direto.
        run: |
          IMAGE_NAME=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_NAME:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image_name }}:latest

  deploy:
    name: Provisionar cluster, banco e aplicar manifestos
    needs: docker-build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - uses: helm/kind-action@v1
        with:
          install_only: true

      - uses: azure/setup-kubectl@v4

      - name: Gerar segredos efêmeros para este deploy de CI
        run: |
          echo "TF_VAR_postgres_password=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      # Provisiona o cluster Kubernetes (kind) e o banco de dados (Postgres)
      # dentro dele — ver /infra/README.md.
      - name: Terraform init & apply (cluster + banco de dados)
        working-directory: infra
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Configurar kubectl para o cluster provisionado
        working-directory: infra
        run: |
          echo "KUBECONFIG=$(terraform output -raw kubeconfig_path)" >> "$GITHUB_ENV"

      - name: Criar Secrets (aplicação + pull da imagem privada do ghcr.io)
        run: |
          kubectl create namespace oficina --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic oficina-app-secret -n oficina \
            --from-literal=DB_USERNAME=oficina \
            --from-literal=DB_PASSWORD="${TF_VAR_postgres_password}" \
            --from-literal=JWT_SECRET="${JWT_SECRET}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry ghcr-pull-secret -n oficina \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITHUB_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -
          # kubectl run (usado no smoke test) não aceita imagePullSecrets por
          # flag — associar à ServiceAccount default cobre qualquer pod criado
          # no namespace, incluindo o do Deployment.
          kubectl patch serviceaccount default -n oficina \
            -p '{"imagePullSecrets": [{"name": "ghcr-pull-secret"}]}'

      # Deploy da aplicação em si — separado do provisionamento de infra acima.
      - name: Aplicar manifestos Kubernetes da aplicação
        run: |
          sed "s#ghcr.io/OWNER/oficina-tech-challenge:latest#${{ needs.docker-build-push.outputs.image_tag }}#" \
            k8s/03-deployment.yaml > /tmp/03-deployment.yaml
          kubectl apply -f k8s/00-namespace.yaml
          kubectl apply -f k8s/01-configmap.yaml
          kubectl apply -f /tmp/03-deployment.yaml
          kubectl apply -f k8s/04-service.yaml
          kubectl apply -f k8s/05-hpa.yaml
          kubectl apply -f k8s/06-mailhog.yaml
          kubectl -n oficina rollout status deployment/oficina-app --timeout=180s || {
            echo "::group::Diagnóstico (rollout não completou a tempo)"
            kubectl -n oficina get pods -o wide
            kubectl -n oficina describe pods -l app=oficina-app
            kubectl -n oficina logs -l app=oficina-app --all-containers --tail=100 || true
            echo "::endgroup::"
            exit 1
          }

      - name: Smoke test — health check e fluxo de autenticação
        run: |
          kubectl -n oficina port-forward svc/oficina-app 8080:80 &
          sleep 5
          curl --fail http://localhost:8080/health

          kubectl -n oficina run seed-admin --rm -i --restart=Never \
            --image=${{ needs.docker-build-push.outputs.image_tag }} \
            --env="DB_HOST=oficina-postgres" --env="DB_PORT=5432" \
            --env="DB_USERNAME=oficina" --env="DB_PASSWORD=${TF_VAR_postgres_password}" \
            --env="DB_DATABASE=oficina" --env="ADMIN_EMAIL=ci@oficina.com" \
            --env="ADMIN_PASSWORD=CiSmokeTest123" -n oficina \
            -- node dist/seed/seed-admin.js

          curl --fail -X POST http://localhost:8080/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"ci@oficina.com","senha":"CiSmokeTest123"}'

      - name: Destruir o cluster efêmero de CI
        if: always()
        working-directory: infra
        run: terraform destroy -auto-approve

  deploy-eks:
    name: Deploy real no EKS (Fase 3)
    needs: docker-build-push
    # Só roda depois que oficina-infra-k8s, oficina-infra-db e
    # oficina-lambda-auth já tiverem sido aplicados (publicam o que este job
    # lê do SSM) e a variável de repositório AWS_DEPLOY_ENABLED=true estiver
    # definida — ver docs/architecture.md. Não interfere no job `deploy`
    # acima (kind efêmero), que continua validando cada push sem custo.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: azure/setup-kubectl@v4
      - uses: azure/setup-helm@v4

      - name: Apontar kubectl para o cluster EKS (oficina-infra-k8s)
        run: |
          EKS_CLUSTER_NAME=$(aws ssm get-parameter --name /oficina/eks_cluster_name --query Parameter.Value --output text)
          aws eks update-kubeconfig --region "${{ vars.AWS_REGION || 'us-east-1' }}" --name "$EKS_CLUSTER_NAME"

      - name: Ler configuração publicada pelos outros repositórios (SSM)
        run: |
          # ::add-mask:: evita que esses valores apareçam em claro no log do
          # Actions (inclusive no dump de env do step seguinte) — GITHUB_ENV
          # sozinho não é suficiente porque o runner não sabe que são segredos.
          DB_ENDPOINT=$(aws ssm get-parameter --name /oficina/db_endpoint --query Parameter.Value --output text)
          DB_USERNAME=$(aws ssm get-parameter --name /oficina/db_username --with-decryption --query Parameter.Value --output text)
          DB_PASSWORD=$(aws ssm get-parameter --name /oficina/db_password --with-decryption --query Parameter.Value --output text)
          JWT_SECRET=$(aws ssm get-parameter --name /oficina/jwt_secret --with-decryption --query Parameter.Value --output text)

          echo "::add-mask::$DB_USERNAME"
          echo "::add-mask::$DB_PASSWORD"
          echo "::add-mask::$JWT_SECRET"

          echo "DB_ENDPOINT=$DB_ENDPOINT" >> "$GITHUB_ENV"
          echo "DB_USERNAME=$DB_USERNAME" >> "$GITHUB_ENV"
          echo "DB_PASSWORD=$DB_PASSWORD" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$JWT_SECRET" >> "$GITHUB_ENV"

      - name: Criar namespace e Secrets (aplicação + pull da imagem + New Relic)
        run: |
          kubectl create namespace oficina --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic oficina-app-secret -n oficina \
            --from-literal=DB_USERNAME="${DB_USERNAME}" \
            --from-literal=DB_PASSWORD="${DB_PASSWORD}" \
            --from-literal=JWT_SECRET="${JWT_SECRET}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry ghcr-pull-secret -n oficina \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITHUB_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl patch serviceaccount default -n oficina \
            -p '{"imagePullSecrets": [{"name": "ghcr-pull-secret"}]}'
          if [ -n "${{ secrets.NEW_RELIC_LICENSE_KEY }}" ]; then
            kubectl create secret generic newrelic-secret -n oficina \
              --from-literal=license-key="${{ secrets.NEW_RELIC_LICENSE_KEY }}" \
              --dry-run=client -o yaml | kubectl apply -f -
          fi

      - name: Aplicar manifestos Kubernetes da aplicação (k8s-aws/)
        run: |
          sed -e "s#ghcr.io/OWNER/oficina-tech-challenge:latest#${{ needs.docker-build-push.outputs.image_tag }}#" \
              k8s-aws/03-deployment.yaml > /tmp/03-deployment.yaml
          sed -e "s#__DB_ENDPOINT__#${DB_ENDPOINT}#" \
              k8s-aws/01-configmap.yaml > /tmp/01-configmap.yaml
          kubectl apply -f k8s-aws/00-namespace.yaml
          kubectl apply -f /tmp/01-configmap.yaml
          kubectl apply -f /tmp/03-deployment.yaml
          kubectl apply -f k8s-aws/04-service.yaml
          kubectl apply -f k8s-aws/05-hpa.yaml
          kubectl apply -f k8s-aws/06-mailhog.yaml
          kubectl -n oficina rollout status deployment/oficina-app --timeout=300s || {
            echo "::group::Diagnóstico (rollout não completou a tempo)"
            kubectl -n oficina get pods -o wide
            kubectl -n oficina describe pods -l app=oficina-app
            kubectl -n oficina logs -l app=oficina-app --all-containers --tail=100 || true
            echo "::endgroup::"
            exit 1
          }

      - name: Reiniciar os pods se o secret do New Relic mudou (novo ou rotacionado)
        env:
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
        run: |
          # `kubectl apply` no Deployment não detecta diff nenhum quando só o
          # *conteúdo* do Secret referenciado muda (o secretKeyRef em si já
          # estava no manifesto) — os pods já em execução continuam sem a
          # env var até serem recriados. Reinicia sempre que a key existir,
          # tanto na primeira vez quanto em rotações futuras.
          if [ -n "$NEW_RELIC_LICENSE_KEY" ]; then
            kubectl -n oficina rollout restart deployment/oficina-app
            kubectl -n oficina rollout status deployment/oficina-app --timeout=180s
          fi

      - name: Instalar integração do New Relic com o Kubernetes (métricas de CPU/memória/healthchecks + logs)
        env:
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
        run: |
          if [ -n "$NEW_RELIC_LICENSE_KEY" ]; then
            helm repo add newrelic https://helm-charts.newrelic.com
            helm repo update
            # --force: o job de certgen do webhook do proprio chart faz
            # server-side apply no MutatingWebhookConfiguration por fora do
            # Helm; a partir do segundo `upgrade` isso gera um conflito de
            # field-manager no campo caBundle (issue conhecida do nri-bundle).
            helm upgrade --install newrelic-bundle newrelic/nri-bundle \
              --namespace newrelic --create-namespace \
              --set global.licenseKey="${NEW_RELIC_LICENSE_KEY}" \
              --set global.cluster=oficina-eks \
              --set newrelic-infrastructure.privileged=true \
              --set kube-state-metrics.enabled=true \
              --set newrelic-logging.enabled=true \
              --set newrelic-logging.fluentBit.filter.excludeSystem=true \
              --force --wait --timeout 5m
          else
            echo "NEW_RELIC_LICENSE_KEY não configurado — pulando integração de Kubernetes."
          fi

      - name: URL pública do app (NLB)
        run: |
          echo "Aguardando o Load Balancer ficar pronto..."
          sleep 30
          kubectl -n oficina get svc oficina-app -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'
